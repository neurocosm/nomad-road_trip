<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NOMAD: RoadTrip - Panic Disco</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #05000a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* HUD Overlay Controls */
    .hud-header {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none;
    }

    .panic-title-wrap {
      background: rgba(11, 0, 26, 0.85);
      border: 2px solid #ff007f;
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.7);
      border-radius: 12px;
      padding: 6px 14px;
      pointer-events: auto;
    }

    .panic-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ff007f;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #ff007f, 0 0 16px #00d4ff;
    }

    .btn-return {
      background: #00d4ff;
      color: #000000;
      border: none;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.8);
      pointer-events: auto;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn-return:active {
      transform: scale(0.92);
      background: #ffe600;
    }

    /* Microphone Permission Prompt Overlay */
    .mic-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 0, 10, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.3s ease;
    }

    .mic-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .mic-box {
      max-width: 320px;
      background: #110022;
      border: 2px solid #00d4ff;
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.4);
      border-radius: 16px;
      padding: 24px 20px;
    }

    .mic-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 4px #ff007f); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 16px #00d4ff); }
    }

    .mic-btn {
      background: #ff007f;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.8);
      margin-top: 16px;
      transition: transform 0.1s ease;
    }

    .mic-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <!-- Top HUD Bar -->
  <div class="hud-header">
    <div class="panic-title-wrap">
      <div class="panic-title">PANIC DISCO</div>
    </div>
    <a href="index.html" class="btn-return">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      DRIVE
    </a>
  </div>

  <!-- Audio Permission Modal -->
  <div class="mic-overlay" id="mic-overlay">
    <div class="mic-box">
      <div class="mic-icon">🎙️</div>
      <h2 style="font-size: 1.35rem; color: #ffffff; margin-bottom: 8px;">Sync Car Audio</h2>
      <p style="font-size: 0.9rem; color: #b3a5c7; line-height: 1.4;">
        Tap below to let the disco tunnel and star-eyed emoji react to the beats in your car!
      </p>
      <button class="mic-btn" onclick="startAudioReactiveEngine()">ENGAGE DISCO</button>
    </div>
  </div>

  <canvas id="visualizer-canvas"></canvas>

  <script>
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, dataArray, bufferLength;
    let isAudioActive = false;

    // Visualizer Tunnel & Particle State
    let tunnelOffset = 0;
    let particles = [];
    const PARTICLE_COUNT = 65;

    // Star-Eyed Emoji State
    let emojiAngle = 0;
    let emojiSpinSpeed = 0.025; // Base drift speed
    let emojiTargetSpinSpeed = 0.025;
    let lastFlipTime = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3 + 1,
          color: ['#00d4ff', '#ff007f', '#ffe600', '#7b2cbf'][Math.floor(Math.random() * 4)],
          speedY: Math.random() * 2 + 0.8,
          speedX: (Math.random() - 0.5) * 1.5,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }

    async function startAudioReactiveEngine() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('mic-overlay').classList.add('hidden');

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        source.connect(analyser);
        isAudioActive = true;
      } catch (err) {
        console.warn("Microphone access declined. Using synthetic pulse fallback.", err);
        document.getElementById('mic-overlay').classList.add('hidden');
        isAudioActive = false;
      }
    }

    function renderFrame() {
      requestAnimationFrame(renderFrame);

      ctx.fillStyle = 'rgba(5, 0, 10, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let bassEnergy = 0;
      let midEnergy = 0;
      let trebleEnergy = 0;

      if (isAudioActive && analyser) {
        analyser.getByteFrequencyData(dataArray);

        // Low-End Sub Bass (Bins 0 to 6)
        let bassSum = 0;
        for (let i = 0; i < 7; i++) bassSum += dataArray[i];
        bassEnergy = (bassSum / 7) / 255;

        // Mids (Bins 7 to 28)
        let midSum = 0;
        for (let i = 7; i < 28; i++) midSum += dataArray[i];
        midEnergy = (midSum / 21) / 255;

        // Highs (Bins 29 to 64)
        let trebleSum = 0;
        for (let i = 29; i < 64; i++) trebleSum += dataArray[i];
        trebleEnergy = (trebleSum / 35) / 255;
      } else {
        // Fallback ambient pulse if no mic
        const time = Date.now() * 0.003;
        bassEnergy = (Math.sin(time) + 1) * 0.25;
        midEnergy = (Math.cos(time * 1.3) + 1) * 0.2;
        trebleEnergy = (Math.sin(time * 2.1) + 1) * 0.15;
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxDim = Math.max(canvas.width, canvas.height);

      // --- 1. RADIAL WARP DISCO RINGS ---
      tunnelOffset += 1.5 + bassEnergy * 5.0;
      const ringCount = 8;
      for (let r = 0; r < ringCount; r++) {
        const ringRadius = ((r * 70 + tunnelOffset) % (maxDim * 0.65));
        const ringAlpha = 1 - (ringRadius / (maxDim * 0.65));

        ctx.beginPath();
        ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
        ctx.lineWidth = 2.5 + bassEnergy * 4;
        ctx.strokeStyle = r % 2 === 0 
          ? `rgba(0, 212, 255, ${ringAlpha * 0.65})` 
          : `rgba(255, 0, 127, ${ringAlpha * 0.65})`;
        ctx.stroke();
      }

      // --- 2. RISING DISCO PARTICLES ---
      particles.forEach(p => {
        p.y -= p.speedY * (1 + bassEnergy * 3.5);
        p.x += p.speedX;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * (1 + trebleEnergy * 1.5), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      // --- 3. DUAL EQUALIZER TOWERS (LEFT & RIGHT) ---
      const barCount = 18;
      const barWidth = Math.max(4, Math.floor(canvas.width * 0.015));
      const maxBarHeight = canvas.height * 0.45;

      for (let i = 0; i < barCount; i++) {
        let val = isAudioActive && dataArray ? (dataArray[i * 2] / 255) : (Math.sin(i * 0.4 + Date.now() * 0.005) + 1) * 0.4;
        const barH = val * maxBarHeight;
        const yPos = centerY - (barH / 2);

        // Left Tower
        const xLeft = 14 + (i * (barWidth + 4));
        ctx.fillStyle = i % 2 === 0 ? '#ff007f' : '#00d4ff';
        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 8;
        ctx.fillRect(xLeft, yPos, barWidth, barH);

        // Right Tower
        const xRight = canvas.width - 14 - ((barCount - i) * (barWidth + 4));
        ctx.fillStyle = i % 2 === 0 ? '#ffe600' : '#ff007f';
        ctx.shadowColor = '#ff007f';
        ctx.shadowBlur = 8;
        ctx.fillRect(xRight, yPos, barWidth, barH);
      }
      ctx.shadowBlur = 0;

      // --- 4. GIANT STAR-EYED EMOJI REACTOR (🤩) ---
      // Beat detection for spin direction flip
      const now = Date.now();
      if ((bassEnergy > 0.72 || midEnergy > 0.65) && (now - lastFlipTime > 650)) {
        // Randomly pick a new rotation direction with a surge of spin momentum
        const direction = Math.random() > 0.5 ? 1 : -1;
        const momentum = 0.07 + Math.random() * 0.09;
        emojiTargetSpinSpeed = direction * momentum;
        lastFlipTime = now;
      }

      // Smoothly interpolate angular speed and decay back toward drift
      emojiSpinSpeed += (emojiTargetSpinSpeed - emojiSpinSpeed) * 0.08;
      emojiTargetSpinSpeed *= 0.985;
      if (Math.abs(emojiTargetSpinSpeed) < 0.02) {
        emojiTargetSpinSpeed = (emojiTargetSpinSpeed >= 0 ? 1 : -1) * 0.022;
      }

      emojiAngle += emojiSpinSpeed;

      // Calculate dynamic font size and audio scale pop
      const baseFontSize = Math.min(canvas.width, canvas.height) * 0.24;
      const emojiScale = 1.0 + (bassEnergy * 0.75);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(emojiAngle);
      ctx.scale(emojiScale, emojiScale);

      // Layered Neon Aura Glow
      ctx.shadowColor = bassEnergy > 0.5 ? '#ffe600' : '#ff007f';
      ctx.shadowBlur = 20 + (bassEnergy * 45);

      ctx.font = `${baseFontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🤩', 0, 0);

      ctx.restore();
    }

    window.onload = () => {
      resizeCanvas();
      renderFrame();
    };
  </script>
</body>
</html>
