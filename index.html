<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  
  <title>Road Trip</title>

  <!-- Web App Manifest for Native Standalone Setup -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Road%20Trip","short_name":"RoadTrip","start_url":".","display":"standalone","background_color":"%23000000","theme_color":"%23000000"}' />

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Grid Proportions: Squarish Map (44fr) with Enlarged Top/Bottom Cards (28fr each) */
    .dashboard {
      display: grid;
      grid-template-rows: 28fr 44fr 28fr;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      height: 100vh;
      height: 100dvh;
      padding: 6px;
      padding-top: max(4px, env(safe-area-inset-top));
      padding-bottom: max(4px, env(safe-area-inset-bottom));
      background-color: #000000;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      border: 1px solid #333333;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      height: 100%;
      min-height: 0;
    }

    /* Top Location Card - Spans full width */
    #location-card {
      grid-row: 1;
      grid-column: 1 / span 2;
      cursor: pointer;
    }

    /* Map Box Row */
    #map-card {
      grid-row: 2;
      grid-column: 1 / span 2;
      padding: 0;
      border-radius: 12px;
      z-index: 1;
      display: block;
      height: 100%;
      position: relative;
      border: 1px solid #333333;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 11px;
    }

    /* MAP OVERLAYS */
    .map-overlay-heading {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      border: 1px solid #444444;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: clamp(0.95rem, 3.5vw, 1.2rem);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, transform 0.15s ease, color 0.2s ease;
    }

    .map-overlay-heading:active {
      transform: scale(0.92);
    }

    .map-overlay-compass {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #cccccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, transform 0.15s ease;
    }

    .map-overlay-compass:active {
      transform: scale(0.92);
    }

    .map-overlay-compass.active-heading-up {
      border: 3px solid #007aff;
    }

    .compass-wrapper-overlay {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .compass-rose-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .compass-needle-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      transform-origin: center center;
    }

    .map-overlay-interstate {
      position: absolute;
      bottom: 2%;
      left: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444444;
      border-radius: 8px;
      padding: 3px 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
    }

    .map-overlay-route {
      position: absolute;
      bottom: 2%;
      right: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444444;
      border-radius: 8px;
      padding: 3px 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
    }

    .map-overlay-interstate:empty,
    .map-overlay-route:empty {
      display: none;
    }

    /* Top-Center Overlay: Fullscreen Toggle Button */
    .map-overlay-fullscreen {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444444;
      border-radius: 8px;
      padding: 5px 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .map-overlay-fullscreen:active {
      transform: translateX(-50%) scale(0.92);
    }

    .vehicle-marker-container {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transition: transform 0.10s ease;
    }

    .vehicle-marker-container:active {
      transform: scale(0.85);
    }

    .card-content-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      min-height: 0;
    }

    /* High-Visibility Location Card Typography */
    .street-value {
      font-size: clamp(2.2rem, 7vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .sub-value-large {
      font-size: clamp(1.4rem, 4.5vw, 1.75rem);
      color: #eeeeee;
      font-weight: 600;
      line-height: 1.2;
      margin-top: 1px;
    }

    .sub-value-meta {
      font-size: clamp(1.15rem, 3.8vw, 1.4rem);
      font-weight: 600;
      line-height: 1.2;
      margin-top: 2px;
    }

    .highway-shield-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
    }

    .weather-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .weather-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-temp {
      font-size: clamp(3.4rem, 11vh, 4.6rem);
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.15s ease;
    }

    .weather-temp:active {
      opacity: 0.6;
    }

    .weather-desc-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(1.4rem, 4.5vw, 1.8rem);
      font-weight: 700;
      margin-top: 4px;
      color: #ffffff;
    }

    .weather-details-stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 600;
      color: #dddddd;
    }

    .speed-sign-card {
      background-color: #111111;
      padding: 4px;
      cursor: pointer;
      user-select: none;
    }

    .speed-sign-card:active {
      opacity: 0.85;
    }

    .speed-sign {
      background-color: #ffffff;
      color: #000000;
      border-radius: 10px;
      border: 3.5px solid #000000;
      position: relative;
      width: 96%;
      height: 96%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .speed-sign::after {
      content: '';
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      right: 3px;
      border: 2px solid #000000;
      border-radius: 6px;
      pointer-events: none;
      transition: border-color 0.2s ease;
    }

    .speed-sign-title,
    .speed-sign-value,
    .speed-sign-unit {
      color: #000000;
      transition: color 0.2s ease;
    }

    .speed-sign-title {
      font-size: clamp(1rem, 3.2vw, 1.3rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }

    .speed-sign-value {
      font-size: clamp(4.5rem, 13vh, 6rem);
      font-weight: 900;
      line-height: 0.9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .speed-sign-unit {
      font-size: clamp(1rem, 3.2vw, 1.3rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .speed-sign.dark-mode-sign {
      background-color: #111111;
      border-color: #ffffff;
    }

    .speed-sign.dark-mode-sign::after {
      border-color: #ffffff;
    }

    .speed-sign.dark-mode-sign .speed-sign-title,
    .speed-sign.dark-mode-sign .speed-sign-value,
    .speed-sign.dark-mode-sign .speed-sign-unit {
      color: #ffffff;
    }

    /* BRANDING ABOUT MODAL STYLING */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #1e1e1e;
      border: 1px solid #444444;
      border-radius: 16px;
      padding: 24px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .modal-author {
      font-size: 1.1rem;
      color: #007aff;
      margin-bottom: 16px;
    }

    .modal-body {
      font-size: 0.95rem;
      color: #cccccc;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-link-btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background-color: #007aff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      transition: background-color 0.15s ease;
    }

    .modal-link-btn:active {
      background-color: #0056b3;
    }

    .modal-close-btn {
      background: transparent;
      border: 1px solid #555555;
      color: #aaaaaa;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Full-Width Top Card: Location Info Stack -->
    <div class="card" id="location-card">
      <div class="card-content-body">
        <div class="street-value" id="street-name">Locating...</div>
        <div class="sub-value-large" id="city-state">--</div>
        <div class="sub-value-large" id="county-zip">--</div>
        <div class="sub-value-meta" style="color: #4cd964;" id="elevation">Elevation: -- ft</div>
        <div class="sub-value-meta" style="color: #aaaaaa;" id="lat-lon">Lat: -- | Lon: --</div>
      </div>
    </div>

    <!-- Center Row: Live Map with Overlays -->
    <div class="card" id="map-card">
      <!-- Top-Left Overlay: Heading Text -->
      <div class="map-overlay-heading" id="heading-text" onclick="copyLocationLink(event)">0° N</div>

      <!-- Top-Center Overlay: Fullscreen Toggle Button -->
      <div class="map-overlay-fullscreen" id="fullscreen-btn" onclick="toggleFullScreen(event)">
        <svg id="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
        </svg>
      </div>

      <!-- Top-Right Overlay: Compact White Compass -->
      <div class="map-overlay-compass active-heading-up" id="compass-btn" onclick="toggleMapMode(event)">
        <div class="compass-wrapper-overlay">
          <svg class="compass-rose-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="none" stroke="#ccc" stroke-width="2" />
            <text x="50" y="16" fill="#ff3b30" font-size="11" font-weight="bold" text-anchor="middle">N</text>
            <text x="86" y="54" fill="#333" font-size="10" font-weight="bold" text-anchor="middle">E</text>
            <text x="50" y="92" fill="#333" font-size="10" font-weight="bold" text-anchor="middle">S</text>
            <text x="14" y="54" fill="#333" font-size="10" font-weight="bold" text-anchor="middle">W</text>
          </svg>

          <svg class="compass-needle-svg" id="needle-svg" viewBox="0 0 100 100">
            <polygon points="50,16 45,50 50,47" fill="#ff3b30" />
            <polygon points="50,16 55,50 50,47" fill="#e02b20" />
            <polygon points="50,84 45,50 50,53" fill="#666666" />
            <polygon points="50,84 55,50 50,53" fill="#444444" />
            <circle cx="50" cy="50" r="4" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
          </svg>
        </div>
      </div>

      <!-- Lower-Left Overlay: Interstate Badge -->
      <div class="map-overlay-interstate" id="interstate-badge-container"></div>

      <!-- Lower-Right Overlay: Route Badge -->
      <div class="map-overlay-route" id="route-badge-container"></div>

      <div id="map"></div>
    </div>

    <!-- Bottom-Left: Weather -->
    <div class="card" id="weather-card">
      <div class="card-content-body">
        <div class="weather-container">
          <div class="weather-main">
            <div class="weather-temp" id="current-temp" onclick="toggleTemperatureUnit(event)">--°F</div>
            <div id="weather-desc">
              <div class="weather-desc-container">Fetching weather...</div>
            </div>
          </div>
          <div class="weather-details-stacked" id="weather-extra">
            <div>Hum: <strong style="color: #ffffff; font-weight: normal;" id="humidity-val">--%</strong></div>
            <div>UV: <strong style="color: #ffffff; font-weight: normal;" id="uv-val">--</strong></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom-Right: Speed Sign Tile -->
    <div class="card speed-sign-card" id="trip-card" onclick="toggleSpeedUnit(event)">
      <div class="speed-sign dark-mode-sign" id="speed-sign-box">
        <div class="speed-sign-title">SPEED</div>
        <div class="speed-sign-value" id="current-speed">0</div>
        <div class="speed-sign-unit" id="speed-unit-label">MPH</div>
      </div>
    </div>
  </div>

  <!-- ABOUT / BRANDING MODAL OVERLAY -->
  <div class="modal-overlay" id="about-modal" onclick="closeAboutModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">NOMAD Road Trip</div>
      <div class="modal-author">by BostonyFX</div>
      <div class="modal-body">
        Real-time telemetry, GPS tracking, and heads-up navigation dashboard.
      </div>
      <a href="https://www.instagram.com/tony_bostony/" target="_blank" rel="noopener noreferrer" class="modal-link-btn">Visit Website</a>
      <div>
        <button class="modal-close-btn" onclick="closeAboutModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // App State Variables
    let map, marker;
    let currentHeading = 0;
    let lastLat = null, lastLon = null;
    let lastWeatherFetchTime = 0;
    let lastGeocodeTime = 0;
    let wakeLock = null;

    // Map Orientation Mode State
    let isHeadingUp = true;

    // Map Tile Style State (Defaults to Dark Matter)
    let isDarkMode = true;
    const darkStyle = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
    const lightStyle = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';

    // Unit State Variables
    let rawTempF = null;
    let isFahrenheit = true;
    let rawSpeedMps = 0;
    let isMph = true;

    const stateAbbreviations = {
      "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR", "California": "CA",
      "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE", "Florida": "FL", "Georgia": "GA",
      "Hawaii": "HI", "Idaho": "ID", "Illinois": "IL", "Indiana": "IN", "Iowa": "IA",
      "Kansas": "KS", "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
      "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS", "Missouri": "MO",
      "Montana": "MT", "Nebraska": "NE", "Nevada": "NV", "New Hampshire": "NH", "New Jersey": "NJ",
      "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH",
      "Oklahoma": "OK", "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
      "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT", "Vermont": "VT",
      "Virginia": "VA", "Washington": "WA", "West Virginia": "WV", "Wisconsin": "WI", "Wyoming": "WY"
    };

    function abbreviateStreetName(streetName) {
      if (!streetName) return '';
      return streetName
        .replace(/\bStreet\b/gi, 'St.')
        .replace(/\bAvenue\b/gi, 'Ave.')
        .replace(/\bRoad\b/gi, 'Rd.')
        .replace(/\bBoulevard\b/gi, 'Blvd.')
        .replace(/\bHighway\b/gi, 'Hwy.')
        .replace(/\bParkway\b/gi, 'Pkwy.')
        .replace(/\bDrive\b/gi, 'Dr.')
        .replace(/\bLane\b/gi, 'Ln.')
        .replace(/\bCircle\b/gi, 'Cir.')
        .replace(/\bCourt\b/gi, 'Ct.')
        .replace(/\bTurnpike\b/gi, 'Tpk.');
    }

    function createInterstateSVG(num) {
      return `
        <div class="highway-shield-badge">
          <svg width="28" height="28" viewBox="0 0 100 100">
            <path d="M 50,4 C 65,4 88,14 96,18 C 96,55 82,82 50,96 C 18,82 4,55 4,18 C 12,14 35,4 50,4 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
            <path d="M 50,7 C 64,7 86,16 93,20 C 93,28 93,32 93,32 L 7,32 C 7,32 7,28 7,20 C 14,16 36,7 50,7 Z" fill="#cc0000" />
            <path d="M 7,32 L 93,32 C 93,54 80,80 50,93 C 20,80 7,54 7,32 Z" fill="#0033cc" />
            <text x="50" y="73" fill="#ffffff" font-size="${num.length > 2 ? '34' : '42'}" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle">${num}</text>
          </svg>
        </div>
      `;
    }

    function createRouteSVG(num) {
      return `
        <div class="highway-shield-badge">
          <svg width="28" height="28" viewBox="0 0 100 100">
            <rect x="4" y="4" width="92" height="92" rx="16" ry="16" fill="#ffffff" stroke="#000000" stroke-width="7" />
            <rect x="9" y="9" width="82" height="82" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="3" />
            <text x="50" y="65" fill="#000000" font-size="${num.length > 2 ? '38' : '48'}" font-weight="bold" font-family="Arial, sans-serif" text-anchor="middle">${num}</text>
          </svg>
        </div>
      `;
    }

    function toggleFullScreen(event) {
      if (event) event.stopPropagation();

      const doc = document.documentElement;
      const icon = document.getElementById('fullscreen-icon');

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen();
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        }
        if (icon) {
          icon.innerHTML = '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7" />';
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        if (icon) {
          icon.innerHTML = '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />';
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (!document.fullscreenElement && icon) {
        icon.innerHTML = '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />';
      }
    });

    function copyLocationLink(event) {
      if (event) event.stopPropagation();

      if (lastLat === null || lastLon === null) {
        alert("GPS location not available yet.");
        return;
      }

      const mapsUrl = `https://www.google.com/maps?q=${lastLat},${lastLon}`;
      const headingEl = document.getElementById('heading-text');

      navigator.clipboard.writeText(mapsUrl).then(() => {
        const originalText = headingEl.innerText;
        const originalColor = headingEl.style.color;

        headingEl.innerText = "COPIED!";
        headingEl.style.color = "#4cd964";

        setTimeout(() => {
          headingEl.innerText = originalText;
          headingEl.style.color = originalColor || "#ffffff";
        }, 1500);
      }).catch((err) => {
        console.error("Clipboard copy error:", err);
      });
    }

    function openAboutModal() {
      const modal = document.getElementById('about-modal');
      if (modal) modal.classList.add('active');
    }

    function closeAboutModal(event) {
      if (event) event.stopPropagation();
      const modal = document.getElementById('about-modal');
      if (modal) modal.classList.remove('active');
    }

    function setupLongPress() {
      const locationCard = document.getElementById('location-card');
      let pressTimer;

      locationCard.addEventListener('contextmenu', (e) => e.preventDefault());

      const startPress = () => {
        pressTimer = setTimeout(() => {
          openAboutModal();
        }, 600);
      };

      const cancelPress = () => {
        clearTimeout(pressTimer);
      };

      locationCard.addEventListener('touchstart', startPress, { passive: true });
      locationCard.addEventListener('touchend', cancelPress);
      locationCard.addEventListener('touchmove', cancelPress);

      locationCard.addEventListener('mousedown', startPress);
      locationCard.addEventListener('mouseup', cancelPress);
      locationCard.addEventListener('mouseleave', cancelPress);
    }

    function toggleMapStyle(event) {
      if (event) event.stopPropagation();
      isDarkMode = !isDarkMode;
      
      if (map) {
        map.setStyle(isDarkMode ? darkStyle : lightStyle);
      }

      const speedSignBox = document.getElementById('speed-sign-box');
      if (speedSignBox) {
        if (isDarkMode) {
          speedSignBox.classList.add('dark-mode-sign');
        } else {
          speedSignBox.classList.remove('dark-mode-sign');
        }
      }
    }

    function toggleMapMode(event) {
      if (event) event.stopPropagation();
      isHeadingUp = !isHeadingUp;

      const compassBtn = document.getElementById('compass-btn');
      if (isHeadingUp) {
        compassBtn.classList.add('active-heading-up');
      } else {
        compassBtn.classList.remove('active-heading-up');
      }

      if (lastLat !== null && lastLon !== null) {
        updateMapCamera([lastLon, lastLat]);
      }
    }

    function toggleTemperatureUnit(event) {
      if (event) event.stopPropagation();
      if (rawTempF === null) return;

      isFahrenheit = !isFahrenheit;
      renderTemperature();
    }

    function renderTemperature() {
      const tempEl = document.getElementById('current-temp');
      if (rawTempF === null) {
        tempEl.innerText = '--°F';
        return;
      }

      if (isFahrenheit) {
        tempEl.innerText = `${Math.round(rawTempF)}°F`;
      } else {
        const tempC = (rawTempF - 32) * (5 / 9);
        tempEl.innerText = `${Math.round(tempC)}°C`;
      }
    }

    function toggleSpeedUnit(event) {
      if (event) event.stopPropagation();
      isMph = !isMph;
      renderSpeed();
    }

    function renderSpeed() {
      const speedValueEl = document.getElementById('current-speed');
      const speedUnitEl = document.getElementById('speed-unit-label');

      if (rawSpeedMps === null || isNaN(rawSpeedMps) || rawSpeedMps < 0) {
        speedValueEl.innerText = '0';
        speedUnitEl.innerText = isMph ? 'MPH' : 'KM/H';
        return;
      }

      if (isMph) {
        const mph = Math.round(rawSpeedMps * 2.23694);
        speedValueEl.innerText = mph;
        speedUnitEl.innerText = 'MPH';
      } else {
        const kmh = Math.round(rawSpeedMps * 3.6);
        speedValueEl.innerText = kmh;
        speedUnitEl.innerText = 'KM/H';
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock active');
        }
      } catch (err) {
        console.error(`Wake Lock error: ${err.name}, ${err.message}`);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    function getWeatherInfo(code) {
      const icons = {
        sun: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
        cloudSun: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.94 11.23a5 5 0 0 0-8.92 2.12 3.5 3.5 0 0 0 .98 6.65h8a4 4 0 0 0 .94-7.77z" stroke="#a0a0a0"/></svg>`,
        cloud: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8.5a7 7 0 0 1-1.2-13.8 8 8 0 0 1 14.8 2.3 4.5 4.5 0 0 1-.6 11.5Z"/></svg>`,
        rain: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8"/><path d="M8 13v8"/><path d="M12 15v8"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" stroke="#a0a0a0"/></svg>`,
        thunder: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffd54f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
        snow: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg>`
      };

      const weatherMap = {
        0: { text: "Clear Sky", icon: icons.sun },
        1: { text: "Mainly Clear", icon: icons.cloudSun },
        2: { text: "Partly Cloudy", icon: icons.cloudSun },
        3: { text: "Overcast", icon: icons.cloud },
        45: { text: "Foggy", icon: icons.cloud },
        51: { text: "Drizzle", icon: icons.rain },
        61: { text: "Slight Rain", icon: icons.rain },
        63: { text: "Moderate Rain", icon: icons.rain },
        71: { text: "Snow", icon: icons.snow },
        80: { text: "Rain Showers", icon: icons.rain },
        95: { text: "Thunderstorm", icon: icons.thunder }
      };

      return weatherMap[code] || { text: "Fair", icon: icons.cloudSun };
    }

    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: isDarkMode ? darkStyle : lightStyle,
        center: [-71.2356, 42.3765],
        zoom: 17,
        bearing: 0,
        pitch: 0,
        attributionControl: false
      });

      const el = document.createElement('div');
      el.className = 'vehicle-marker-container';
      el.id = 'vehicle-arrow-icon';
      el.onclick = toggleMapStyle;
      el.innerHTML = `
        <svg width="36" height="36" viewBox="0 0 24 24" fill="#007aff" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));">
          <polygon points="12 2 19 21 12 17 5 21 12 2"/>
        </svg>
      `;

      marker = new maplibregl.Marker({ 
        element: el, 
        rotationAlignment: 'viewport',
        offset: [0, 50]
      })
        .setLngLat([-71.2356, 42.3765])
        .addTo(map);
    }

    function getCardinalDirection(angle) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return directions[Math.round(angle / 45) % 8];
    }

    async function fetchLocationDetails(lat, lon) {
      document.getElementById('lat-lon').innerText = `Lat: ${lat.toFixed(5)} | Lon: ${lon.toFixed(5)}`;

      const now = Date.now();
      if (now - lastGeocodeTime < 15000) return;
      lastGeocodeTime = now;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        const data = await response.json();
        
        if (data && data.address) {
          const addr = data.address;
          
          // Sanitizer: Split semicolon-separated building ranges ("542;544;546" -> "542")
          let cleanHouseNum = addr.house_number ? addr.house_number.split(';')[0].trim() : '';
          const houseNum = cleanHouseNum ? `${cleanHouseNum} ` : '';
          
          const road = addr.road || addr.pedestrian || addr.suburb || "Unnamed Road";
          
          const fullStreetAddress = abbreviateStreetName(`${houseNum}${road}`);

          const city = addr.city || addr.town || addr.village || "";
          const stateFull = addr.state || "";
          const county = addr.county || "";
          const postcode = addr.postcode || "";

          const stateCode = stateAbbreviations[stateFull] || stateFull;

          document.getElementById('street-name').innerText = fullStreetAddress;
          document.getElementById('city-state').innerText = `${city}${city && stateCode ? ', ' : ''}${stateCode}`;
          document.getElementById('county-zip').innerText = `${county} ${postcode}`.trim();

          // Search target using only road/highway fields (excluding full display_name to avoid house number matches)
          const searchTarget = [
            addr.ref,
            addr.road,
            addr.highway,
            addr.official_name
          ].filter(Boolean).join(' ');

          let interstateNum = null;
          let routeNum = null;

          // Catch Interstate patterns (e.g., I-95, Interstate 95, I95)
          const interstateMatch = searchTarget.match(/(?:I-?|Interstate\s?)(\d{1,3})\b/i);
          if (interstateMatch) {
            interstateNum = interstateMatch[1];
          }

          // Catch State/US Route patterns specifically requiring Route/Rt/US/Hwy prefixes or ref badges
          if (addr.ref) {
            const refMatch = addr.ref.match(/\d+[A-Z]?/i);
            if (refMatch && refMatch[0] !== interstateNum) {
              routeNum = refMatch[0];
            }
          } else {
            const routeMatch = searchTarget.match(/(?:US-?|Route\s?|Rt\.?\s?|[A-Z]{2}-?\s?|State Hwy\s?)(\d+[A-Z]?)\b/i);
            if (routeMatch && routeMatch[1] !== interstateNum) {
              routeNum = routeMatch[1];
            }
          }

          const interstateContainer = document.getElementById('interstate-badge-container');
          if (interstateNum) {
            interstateContainer.innerHTML = createInterstateSVG(interstateNum);
          } else {
            interstateContainer.innerHTML = '';
          }

          const routeContainer = document.getElementById('route-badge-container');
          if (routeNum) {
            routeContainer.innerHTML = createRouteSVG(routeNum);
          } else {
            routeContainer.innerHTML = '';
          }
        }
      } catch (err) {
        console.error("Reverse geocoding error:", err);
      }
    }

    async function fetchWeatherAndElevation(lat, lon) {
      const now = Date.now();
      if (now - lastWeatherFetchTime < 600000 && lastWeatherFetchTime !== 0) return;
      lastWeatherFetchTime = now;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,uv_index&temperature_unit=fahrenheit&timezone=auto`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.elevation !== undefined) {
          const feet = Math.round(data.elevation * 3.28084);
          document.getElementById('elevation').innerText = `Elevation: ${feet.toLocaleString()} ft`;
        }

        if (data.current) {
          rawTempF = data.current.temperature_2m;
          renderTemperature();

          const info = getWeatherInfo(data.current.weather_code);
          document.getElementById('weather-desc').innerHTML = `
            <div class="weather-desc-container">
              ${info.icon} <span>${info.text}</span>
            </div>
          `;

          if (data.current.relative_humidity_2m !== undefined) {
            document.getElementById('humidity-val').innerText = `${Math.round(data.current.relative_humidity_2m)}%`;
          }

          if (data.current.uv_index !== undefined) {
            const uv = data.current.uv_index.toFixed(1);
            let uvColor = '#4cd964';
            if (uv >= 3 && uv < 6) uvColor = '#ffcc00';
            else if (uv >= 6 && uv < 8) uvColor = '#ff9500';
            else if (uv >= 8) uvColor = '#ff3b30';

            document.getElementById('uv-val').innerHTML = `<span style="color: ${uvColor}; font-weight: normal;">${uv}</span>`;
          }
        }

      } catch (err) {
        console.error("Weather API error:", err);
      }
    }

    function updateHeading(heading) {
      if (heading !== null && !isNaN(heading)) {
        currentHeading = heading;
        const cardinal = getCardinalDirection(heading);
        document.getElementById('heading-text').innerText = `${Math.round(heading)}° ${cardinal}`;
        
        const needleEl = document.getElementById('needle-svg');
        if (needleEl) {
          needleEl.style.transform = `rotate(${heading}deg)`;
        }
      }
    }

    function updateMapCamera(lngLat) {
      const vehicleSvg = document.querySelector('#vehicle-arrow-icon svg');

      if (isHeadingUp) {
        if (marker) marker.setOffset([0, 50]);
        map.easeTo({
          center: lngLat,
          bearing: currentHeading,
          duration: 300,
          easing: (t) => t
        });
        if (vehicleSvg) vehicleSvg.style.transform = 'rotate(0deg)';
      } else {
        if (marker) marker.setOffset([0, 0]);
        map.easeTo({
          center: lngLat,
          bearing: 0,
          duration: 300,
          easing: (t) => t
        });
        if (vehicleSvg) vehicleSvg.style.transform = `rotate(${currentHeading}deg)`;
      }
    }

    function startTracking() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, heading, speed } = position.coords;

            const lngLat = [longitude, latitude];
            marker.setLngLat(lngLat);

            if (heading !== null && !isNaN(heading)) {
              currentHeading = heading;
            }

            updateMapCamera(lngLat);

            if (heading !== null && !isNaN(heading)) {
              updateHeading(heading);
            }

            rawSpeedMps = speed;
            renderSpeed();

            lastLat = latitude;
            lastLon = longitude;

            fetchLocationDetails(latitude, longitude);
            fetchWeatherAndElevation(latitude, longitude);
          },
          (error) => {
            console.error("GPS Error:", error);
            document.getElementById('street-name').innerText = "GPS Access Denied";
          },
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
          }
        );
      }
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (event) => {
        if (event.webkitCompassHeading) {
          updateHeading(event.webkitCompassHeading);
        }
      });
    }

    window.onload = () => {
      initMap();
      startTracking();
      requestWakeLock();
      setupLongPress();
    };
  </script>
</body>
</html>
